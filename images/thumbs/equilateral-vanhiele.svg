      <stop offset="0" stop-color="#0a0f1d"></stop>
      <stop offset="1" stop-color="#111827"></stop>
    </linearGradient>
  </defs>

  <rect width="900" height="500" rx="36" fill="url(#bg)"></rect>
  <rect x="40" y="40" width="820" height="420" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="4"></rect>

