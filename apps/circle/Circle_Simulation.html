<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة هندسة الدائرة - المهندس زهدي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <header>
        <h1>مختبر الدائرة التفاعلي</h1>
        <p>استكشف العلاقة بين نصف القطر، القطر، والوتر</p>
    </header>

    <div class="dashboard">
        <div class="stat-card">
            <span class="label">نصف القطر (نق)</span>
            <span id="radiusVal" class="value">50</span> <small>ملم</small>
        </div>
        <div class="stat-card">
            <span class="label">طول القطر (ق)</span>
            <span id="diamVal" class="value">100</span> <small>ملم</small>
        </div>
        <div class="stat-card highlight">
            <span class="label">طول الوتر الحالي</span>
            <span id="chordVal" class="value">0</span> <small>ملم</small>
        </div>
    </div>

    <div class="controls">
        <label for="radiusSlider">تغيير حجم الدائرة (نصف القطر):</label>
        <input type="range" id="radiusSlider" min="50" max="180" value="150">
    </div>

    <div class="canvas-area">
        <canvas id="circleCanvas" width="500" height="450"></canvas>
        <div id="feedbackMsg">حرك النقاط الحمراء على محيط الدائرة</div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
