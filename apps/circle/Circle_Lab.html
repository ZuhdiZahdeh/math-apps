<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر تطبيقات الرياضيات - الدائرة</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
    <header>
        <h1>مختبر هندسة الدائرة</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('identify')">المستوى 1: استكشاف العناصر</button>
            <button class="tab-btn" onclick="switchTab('explore')">المستوى 2: تحدي القطر والوتر</button>
            <button class="tab-btn" onclick="switchTab('quiz')">المستوى 3: اختبر معلوماتك</button>
        </div>
    </header>

    <div id="identify-mode" class="mode-container active-mode">
        <div class="main-layout">
            <div class="canvas-section">
                <canvas id="identifyCanvas" width="450" height="450"></canvas>
                <div id="descriptionBox">اختر عنصراً من القائمة للتعرف عليه. اضغط مراراً لرؤية أمثلة مختلفة.</div>
            </div>
            <div class="elements-list">
                <button class="list-btn" onclick="highlight('center')">مركز الدائرة</button>
                <button class="list-btn" onclick="highlight('radius')">نصف القطر</button>
                <button class="list-btn" onclick="highlight('diameter')">القطر</button>
                <button class="list-btn" onclick="highlight('chord')">الوتر</button>
                <button class="list-btn" onclick="highlight('arc')">القوس</button>
                <button class="list-btn" onclick="highlight('circumference')">المحيط</button>
            </div>
        </div>
    </div>

    <div id="explore-mode" class="mode-container">
        <div class="explore-layout">
            <div class="explore-sidebar">
                <div class="stat-card">
                    <span class="label">نصف القطر (نق)</span>
                    <div class="value-wrap"><span id="radiusVal" class="value">50</span> <small>ملم</small></div>
                </div>
                <div class="stat-card">
                    <span class="label">طول القطر (ق)</span>
                    <div class="value-wrap"><span id="diamVal" class="value">100</span> <small>ملم</small></div>
                </div>
                <div class="stat-card highlight-card">
                    <span class="label">القطعة أب تسمى: <strong id="chordType">وتر</strong></span>
                    <div class="value-wrap"><span id="chordVal" class="value">0</span> <small>ملم</small></div>
                </div>
                <div class="controls stat-card" style="background: white;">
                    <label style="display:block; margin-bottom:10px; font-weight:bold; color:#2c3e50;">تغيير الحجم:</label>
                    <input type="range" id="radiusSlider" min="50" max="180" value="150" style="width: 100%;">
                </div>
            </div>
            <div class="explore-canvas-wrapper">
                <canvas id="exploreCanvas" width="550" height="480"></canvas>
                <div id="feedbackMsg">حرك النقطتين الحمراوين (أ، ب)</div>
            </div>
        </div>
    </div>

    <div id="quiz-mode" class="mode-container">
        <div class="quiz-layout">
            <div class="quiz-canvas-section">
                <canvas id="quizCanvas" width="450" height="450"></canvas>
            </div>
            <div class="quiz-questions-section" id="quiz-questions-container">
                </div>
        </div>
    </div>
</div>

<audio id="successSound"><source src="../audio/success/applause.mp3" type="audio/mpeg"></audio>
<audio id="failSound"><source src="../audio/fail/fail_toolMatch_b.mp3" type="audio/mpeg"></audio>

<script src="js/script.js"></script>
</body>
</html>
