<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>لعبة الارتفاعات الهندسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h2>تحدي الارتفاعات: الصف السادس</h2>
            <div id="score-board">النقاط: <span id="score">0</span></div>
        </header>
        
        <div class="main-layout">
            <div class="visual-area" id="canvas">
                </div>
            
            <div class="interaction-area">
                <div class="question-box" id="question">جاري التحميل...</div>
                <div class="options-container" id="options">
                    </div>
                <div id="feedback" class="feedback-area"></div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
