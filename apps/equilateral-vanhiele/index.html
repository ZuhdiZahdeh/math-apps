<!-- المستوى 1 -->
<section class="panel level is-active" data-level="1">
  <h2>المستوى 1 (بصري): بطاقة واحدة — صنّف الشكل</h2>
  <p class="hint">
    انظر للشكل فقط (بدون قياس)، ثم اختر:
    <b>متساوي الأضلاع</b> أو <b>متساوي الساقين</b> أو <b>غير ذلك</b>.
    <span class="tag">بصري فقط</span>
  </p>

  <div class="l1stage">
    <div class="l1card panel">
      <div class="l1top">
        <div class="l1num">
          بطاقة <span id="l1Now">1</span> / <span id="l1Total">24</span>
        </div>
        <div id="l1Status" class="muted">اختر إجابة ثم اضغط “تحقّق”.</div>
      </div>

      <div id="l1BigShape" class="l1big" aria-live="polite"></div>

      <div class="l1answers">
        <button class="ansbtn" data-ans="eq">مثلث متساوي الأضلاع</button>
        <button class="ansbtn" data-ans="iso">مثلث متساوي الساقين</button>
        <button class="ansbtn" data-ans="other">غير ذلك</button>
      </div>

      <div class="l1actions">
        <button id="l1CheckOne" class="btn primary" disabled>تحقّق</button>
        <button id="l1Prev" class="btn">السابق</button>
        <button id="l1Next" class="btn">التالي</button>
        <button id="l1Restart" class="btn danger">إعادة المستوى 1</button>
        <span id="l1ScoreOne" class="muted"></span>
      </div>
    </div>

    <div class="l1nav panel">
      <div class="l1navhdr">
        <span class="muted">انتقل مباشرة:</span>
      </div>
      <div id="l1Nums" class="l1nums"></div>
    </div>
  </div>

  <div class="nextrow">
    <button id="to2" class="btn primary">انتقل للمستوى 2</button>
    <span id="l1Msg" class="muted"></span>
  </div>
</section>
