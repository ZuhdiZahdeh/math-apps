<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تحدي مهندس المساحة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>تحدي مهندس المساحة 📐</h1>
            <div id="status-bar">
                <span>المستوى: <span id="level-num">1</span></span>
                <span>النقاط: <span id="score">0</span></span>
            </div>
        </header>

        <main id="game-screen">
            <div id="quest-box">
                <p id="instruction">استخدم مهاراتك الهندسية لحساب المساحات المطلوبة!</p>
                <div id="shape-display"></div>
            </div>

            <div id="interaction-area">
                <div id="question-text"></div>
                <div class="input-group">
                    <input type="number" id="answer-input" placeholder="0">
                    <button id="submit-btn">تحقق من الإجابة</button>
                </div>
                <p id="feedback"></p>
            </div>
        </main>

        <div id="overlay" class="hidden">
            <div class="modal">
                <h2 id="modal-title">رائع!</h2>
                <p id="modal-text"></p>
                <button id="next-level-btn">المستوى التالي</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
