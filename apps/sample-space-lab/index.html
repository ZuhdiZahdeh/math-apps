<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لعبة الفضاء العيني — مغامرة Ω</title>
  <meta name="description" content="لعبة تربوية تفاعلية لتعليم كتابة الفضاء العيني وعدّ عناصره وربط التجربة المناسبة بفضائها العيني.">
  <link rel="icon" href="images/thumb.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div>
  <div class="bg-orb orb-b" aria-hidden="true"></div>
  <div class="bg-orb orb-c" aria-hidden="true"></div>

  <a class="omega-badge" href="../../index.html" title="الرجوع إلى الفهرس">Ω</a>

  <div class="shell">
    <header class="hero compact-hero">
      <div class="topbar">
        <a class="btn small ghost" href="../../index.html" title="الرجوع إلى الصفحة الرئيسية">↩︎ رجوع</a>
        <h1>لعبة الفضاء العيني — مغامرة Ω</h1>
        <span class="pill accent">الصفوف 5–9</span>
        <a class="btn small ghost" href="guide.html" title="الانتقال إلى صفحة التعريف والإرشادات">ℹ️ التعريف باللعبة</a>
        <button id="soundToggleBtn" class="btn small ghost sound-toggle" type="button" aria-pressed="true" title="تفعيل أو كتم أصوات التعزيز">🔊 الصوت مفعّل</button>
      </div>
    </header>

    <nav class="mode-bar" aria-label="أنماط اللعبة">
      <button class="mode-btn active" data-tab="levels">المستويات</button>
      <button class="mode-btn" data-tab="matching">وفق بين العمودين</button>
      <button class="mode-btn" data-tab="reverse">بالعكس</button>
      <button class="mode-btn" data-tab="glossary">بطاقات المفهوم</button>
    </nav>

    <main>
      <section id="levelsTab" class="tab-panel active" aria-labelledby="المستويات">
        <div id="levelCards" class="level-cards"></div>

        <div class="play-grid solo">
          <article class="card question-card">
            <div class="question-head">
              <div class="question-meta">
                <span id="levelBadge" class="pill muted">—</span>
                <span id="questionCounter" class="pill muted">—</span>
              </div>
              <div id="levelStars" class="stars" aria-label="نجوم المستوى"></div>
            </div>

            <div class="question-layout">
              <div class="question-media">
                <img id="questionImage" src="images/thumb.svg" alt="صورة توضيحية للسؤال">
              </div>

              <div class="question-body">
                <div id="ruleBox" class="rule-box" hidden></div>
                <h2 id="questionPrompt">...</h2>
                <div id="spacePreview" class="space-preview" hidden></div>
                <div id="stagesBox" class="stages-box"></div>
                <div id="answerBox" class="answer-box"></div>

                <div class="controls">
                  <button id="checkBtn" class="btn primary">تحقق</button>
                  <button id="hintBtn" class="btn small ghost">تلميح</button>
                  <button id="showBtn" class="btn small warm">أظهر الحل</button>
                  <button id="nextBtn" class="btn small violet">التالي</button>
                </div>

                <div id="feedbackBox" class="feedback" aria-live="polite"></div>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section id="matchingTab" class="tab-panel" aria-labelledby="وفق بين العمودين">
        <div class="submode-bar">
          <button class="submode-btn active" data-match-mode="terms">مصطلح وتعريف</button>
          <button class="submode-btn" data-match-mode="experiments">تجربة وفضاؤها</button>
          <button id="shuffleMatchingBtn" class="btn small ghost inline-end">أعد الخلط</button>
        </div>

        <article class="card matching-card">
          <div class="matching-head">
            <div>
              <h2>وفق بين العمودين</h2>
            </div>
            <div class="pill accent" id="matchingStatusPill">0 / 0</div>
          </div>

          <div id="matchingBoard" class="matching-board">
            <div id="matchLeft" class="match-column"></div>
            <svg id="matchLines" class="match-lines" aria-hidden="true"></svg>
            <div id="matchRight" class="match-column"></div>
          </div>

          <div id="matchingFeedback" class="feedback" aria-live="polite"></div>
        </article>
      </section>

      <section id="reverseTab" class="tab-panel" aria-labelledby="بالعكس">
        <div class="play-grid solo">
          <article class="card question-card">
            <div class="question-head">
              <div class="question-meta">
                <span class="pill accent">النمط العكسي</span>
                <span id="reverseCounter" class="pill muted">—</span>
              </div>
            </div>

            <div class="question-layout">
              <div class="question-media">
                <img id="reverseImage" src="images/reverse.svg" alt="صورة السؤال العكسي">
              </div>

              <div class="question-body">
                <h2 id="reversePrompt">...</h2>
                <div id="reverseSpace" class="space-preview reverse-space"></div>
                <div id="reverseChoices" class="choices-grid"></div>

                <div class="controls">
                  <button id="reverseCheckBtn" class="btn primary">تحقق</button>
                  <button id="reverseShowBtn" class="btn small warm">أظهر الحل</button>
                  <button id="reverseNextBtn" class="btn small violet">التالي</button>
                </div>

                <div id="reverseFeedback" class="feedback" aria-live="polite"></div>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section id="glossaryTab" class="tab-panel" aria-labelledby="بطاقات المفهوم">
        <div id="glossaryGrid" class="glossary-grid"></div>
      </section>
    </main>

    <footer class="foot">
      <span>مغامرة Ω — لعبة تربوية في الاحتمالات والفضاء العيني.</span>
      <span> • </span>
      <a href="guide.html">صفحة التعريف والإرشادات</a>
    </footer>
  </div>

  <noscript>
    <div class="noscript-msg">الرجاء تفعيل JavaScript لتشغيل اللعبة.</div>
  </noscript>

  <script src="app.js" defer></script>
</body>
</html>
