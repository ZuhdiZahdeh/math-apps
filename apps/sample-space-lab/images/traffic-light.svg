  <rect x="58" y="56" width="784" height="788" rx="42" fill="rgba(8,17,33,0.46)" stroke="rgba(255,255,255,0.12)"/>
  <rect x="88" y="84" width="240" height="54" rx="27" fill="#22c55e" opacity="0.95"/>
  <text x="208" y="119" font-size="28" font-family="Arial, Tahoma, sans-serif" text-anchor="middle" fill="#0b1220" font-weight="700">من النوع نفسه</text>
  <text x="450" y="192" font-size="58" font-family="Arial, Tahoma, sans-serif" text-anchor="middle" fill="#ffffff" font-weight="900">إشارتان متتاليتان</text>
  <g filter="url(#shadow)">
    
  <rect x="340" y="238" width="220" height="430" rx="44" fill="#111827" stroke="#475569" stroke-width="8"/>
  <circle cx="450" cy="340" r="62" fill="#ef4444"/>
  <circle cx="450" cy="455" r="62" fill="#f59e0b"/>
  <circle cx="450" cy="570" r="62" fill="#10b981"/>
