<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="نظام تعلم تفاعلي موحد لوحدة الهندسة للصف السادس الأساسي">
  <title>رحلة مهندس الهندسة</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">تجاوز إلى المحتوى</a>

  <header class="app-header" aria-label="رأس التطبيق">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">📐</div>
      <div>
        <p class="eyebrow">وحدة الهندسة - الصف السادس الأساسي</p>
        <h1>رحلة مهندس الهندسة</h1>
        <p class="subtitle">نظام تعلم تفاعلي موحّد: أهداف، ألعاب، تغذية راجعة، وتقويم تكويني.</p>
      </div>
    </div>
    <nav class="top-actions" aria-label="تنقل سريع">
      <button type="button" class="btn ghost" data-action="home">الرئيسية</button>
      <button type="button" class="btn ghost" data-action="map">خريطة الوحدة</button>
      <button type="button" class="btn ghost" data-action="report">تقرير الطالب</button>
      <button type="button" class="btn ghost" data-action="teacher">لوحة المعلم</button>
    </nav>
  </header>

  <main id="app" class="app-shell" tabindex="-1" aria-live="polite"></main>

  <footer class="app-footer">
    <span>ملف الأسئلة: <code>data/geometry-questions.js</code></span>
    <span>ملف التنسيق: <code>css/style.css</code></span>
    <span>ملف البرمجة: <code>js/script.js</code></span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript-message">يحتاج التطبيق إلى تفعيل JavaScript حتى تعمل الأنشطة التفاعلية.</div>
  </noscript>

  <script src="data/geometry-questions.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
